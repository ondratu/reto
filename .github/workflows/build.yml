---
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflows run the build and tests first
  workflow_call:
    inputs:
      skip-windows:
        description: Build and test only on Linux
        type: boolean
        default: false
      package-windows:
        description: Also make the Windows packages from the tested builds
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  meson:
    name: Build and test with Meson (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Flathub builds for both architectures
        os: [ubuntu-26.04, ubuntu-26.04-arm]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson valac \
            libgtk-4-dev libadwaita-1-dev \
            desktop-file-utils appstream xvfb
      - name: Build
        run: |
          meson setup build
          meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs

  windows:
    if: ${{ !inputs.skip-windows }}
    name: Build and test on Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
            msystem: UCRT64
            prefix: mingw-w64-ucrt-x86_64
          - arch: aarch64
            runner: windows-11-arm
            msystem: CLANGARM64
            prefix: mingw-w64-clang-aarch64

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ inputs.package-windows && 'zip' || '' }}
          pacboy: >-
            toolchain:p meson:p vala:p pkgconf:p
            gtk4:p libadwaita:p
            ${{ inputs.package-windows
                && 'librsvg:p adwaita-icon-theme:p' || '' }}
      - name: Build
        run: |
          meson setup build --buildtype=release
          meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs
      # The package is made from this build and in this job, so the tested
      # program and libraries are the shipped ones, and nothing is compiled
      # twice.
      - name: Build package
        if: inputs.package-windows
        run: tools/build-windows.sh ${{ matrix.arch }} dist build
      - name: Upload package
        if: inputs.package-windows
        uses: actions/upload-artifact@v7
        with:
          name: cz.zeropage.Reto-windows-${{ matrix.arch }}
          path: dist/*.zip
          retention-days: 30
          if-no-files-found: error
