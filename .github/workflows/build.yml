---
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflows run the build and tests first
  workflow_call:
    inputs:
      keep-windows-build:
        description: Keep the Windows builds for packaging
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  meson:
    name: Build and test with Meson (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Flathub builds for both architectures
        os: [ubuntu-26.04, ubuntu-26.04-arm]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson valac \
            libgtk-4-dev libadwaita-1-dev \
            desktop-file-utils appstream xvfb
      - name: Build
        run: |
          meson setup build
          meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs

  windows:
    name: Build and test on Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
            msystem: UCRT64
            prefix: mingw-w64-ucrt-x86_64
          - arch: aarch64
            runner: windows-11-arm
            msystem: CLANGARM64
            prefix: mingw-w64-clang-aarch64

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          pacboy: >-
            toolchain:p meson:p vala:p pkgconf:p
            gtk4:p libadwaita:p
      - name: Build
        run: |
          meson setup build --buildtype=release
          meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs
      # The package is made from this build, so the tested program is the
      # shipped one and it is not compiled twice.
      - name: Keep the build for packaging
        if: inputs.keep-windows-build
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-${{ matrix.arch }}
          path: build
          retention-days: 1
          if-no-files-found: error
