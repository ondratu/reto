---
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  meson:
    name: Build and test with Meson (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Flathub builds for both architectures
        os: [ubuntu-26.04, ubuntu-26.04-arm]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson valac \
            libgtk-4-dev libadwaita-1-dev \
            desktop-file-utils appstream xvfb
      - name: Build
        run: |
          meson setup build
          meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs
