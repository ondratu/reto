---
name: Flatpak

# Builds the Flatpak bundles for both architectures, like Flathub does.
# Run manually, the bundles are kept as build artifacts. Run by publishing a
# release, the bundles are also attached to that release and the signed
# Flatpak repository on the website (the gh-pages branch) is updated.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Also update the Flatpak repository on the website
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build Flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build bundle
        run: tools/build-flatpak.sh ${{ matrix.arch }} dist
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cz.zeropage.Reto-${{ matrix.arch }}
          path: dist/*.flatpak
          retention-days: 30
          if-no-files-found: error

  release:
    name: Attach to release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v8
        with:
          pattern: cz.zeropage.Reto-*
          merge-multiple: true
          path: dist
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/*.flatpak --clobber --repo "$REPO"

  publish:
    name: Publish repository
    # Only a final release or a manual run of main updates the public repository
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease)
      || (inputs.publish && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: write
    concurrency:
      group: flatpak-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout website
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site
      - name: Install tooling
        run: sudo apt-get update && sudo apt-get install -y flatpak ostree gnupg
      - name: Download bundles
        uses: actions/download-artifact@v8
        with:
          pattern: cz.zeropage.Reto-*
          merge-multiple: true
          path: dist
      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          home=$(mktemp -d)
          echo "GNUPGHOME=$home" >> "$GITHUB_ENV"
          printf '%s' "$GPG_PRIVATE_KEY" \
            | gpg --homedir "$home" --batch --import
          gpg --homedir "$home" --list-secret-keys --with-colons \
            | awk -F: '$1 == "fpr" { print "GPG_KEY_ID=" $10; exit }' \
            >> "$GITHUB_ENV"
          grep -q '^GPG_KEY_ID=.' "$GITHUB_ENV" \
            || { echo "No signing key imported" >&2; exit 1; }
      - name: Build the repository
        run: tools/publish-flatpak-repo.sh dist site/flatpak "$GPG_KEY_ID"
      - name: Push to the website
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all flatpak
          if git diff --cached --quiet; then
            echo "The repository is up to date"
            exit 0
          fi
          git commit -m "Update the Flatpak repository ($REF_NAME)"
          git pull --rebase origin gh-pages
          git push origin gh-pages
          # A push made with GITHUB_TOKEN does not start the website workflow
          gh workflow run pages.yml --ref gh-pages
