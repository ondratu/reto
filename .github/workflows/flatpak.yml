---
name: Flatpak

# Builds the Flatpak bundles for both architectures, like Flathub does.
# Run manually, the bundles are kept as build artifacts. Run by publishing a
# release, the bundles are also attached to that release.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build Flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build bundle
        run: tools/build-flatpak.sh ${{ matrix.arch }} dist
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cz.zeropage.Reto-${{ matrix.arch }}
          path: dist/*.flatpak
          retention-days: 30
          if-no-files-found: error

  release:
    name: Attach to release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v8
        with:
          pattern: cz.zeropage.Reto-*
          merge-multiple: true
          path: dist
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/*.flatpak --clobber --repo "$REPO"
