---
name: Flatpak

# Manual only: builds the Flatpak bundles for both architectures, like Flathub
# does. Give a tag to also attach the bundles to the release of that tag.
on:
  # TEMPORARY: remove before merging, lets the branch be tested before main
  push:
    branches: [flatpak-ci]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach bundles to (empty = artifacts only)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build Flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build bundle
        run: tools/build-flatpak.sh ${{ matrix.arch }} dist
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cz.zeropage.Reto-${{ matrix.arch }}
          path: dist/*.flatpak
          retention-days: 30
          if-no-files-found: error

  release:
    name: Attach to release
    if: inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          pattern: cz.zeropage.Reto-*
          merge-multiple: true
          path: dist
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" dist/*.flatpak \
            --clobber --repo "${{ github.repository }}"
