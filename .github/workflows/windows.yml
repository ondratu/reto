---
name: Windows

# Builds the installers for both architectures. The build and tests
# workflow makes them, from the very builds that were tested, and nothing is
# released when it fails. Run manually, the installers are kept as build
# artifacts. Run by publishing a release, the installers are also attached to
# that release.
on:
  # TEMPORARY, while the Windows package is debugged on its branch: a manual
  # run is only offered for workflows on the default branch, so a push to the
  # branch starts it instead. Remove this push trigger before merging into
  # main.
  push:
    branches: [windows-build]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Build, test and package
    uses: ./.github/workflows/build.yml
    with:
      package-windows: true

  release:
    name: Attach to release
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: cz.zeropage.Reto-windows-*
          merge-multiple: true
          path: dist
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/*-setup.exe --clobber --repo "$REPO"
