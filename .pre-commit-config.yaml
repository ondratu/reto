repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  # Validate reStructuredText syntax
  - repo: https://github.com/rstcheck/rstcheck
    rev: v6.2.5
    hooks:
      - id: rstcheck
        additional_dependencies: [docutils]
        args: ["--ignore-directives=class,footer"]

  - repo: local
    hooks:
      # Validate CSS brace balance and structure
      - id: css-validate
        name: CSS syntax check
        language: system
        entry: python3 check_css.py
        types: [css]

      # Verify the RST builds successfully with rst2html5
      - id: rst-build
        name: RST → HTML5 build check
        language: system
        entry: bash -c 'rst2html5 --no-doc-title --stylesheet=_static/style.css --link-stylesheet --title="Reto" index.rst /dev/null'
        pass_filenames: false
        files: ^(index\.rst|_static/style\.css)$
