---
id: cz.zeropage.Reto
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: reto
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: reto
    buildsystem: meson
    sources:
      - type: git
        # The repository this manifest lives in, at the checked out commit
        url: ..
        branch: HEAD
